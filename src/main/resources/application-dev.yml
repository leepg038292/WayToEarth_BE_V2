spring:
  application:
    name: waytoearth-dev

  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS:false} # 가상 스레드 검증/비교용 - 기본은 꺼짐, env var로 토글

  config:
    import: 
      - optional:dotenv:.env
      - optional:file:.env

  # 개발 환경 데이터베이스
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update  # 개발환경에서는 스키마 자동 업데이트
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
    open-in-view: false

# 크루 채팅 DB 동시성 백프레셔 (docs/study/04-crew-chat-scalability-redis-pubsub.md §12 참고)
chat:
  db-concurrency-limit: ${CHAT_DB_CONCURRENCY_LIMIT:30}

# 개발 서버 설정
server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    mbeanregistry:
      enabled: true # Tomcat 스레드 풀(tomcat_threads_*) 지표를 Micrometer/Prometheus로 노출하기 위함

# 로깅 설정 (개발환경 - 상세 로그)
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    com.waytoearth: DEBUG
    org.springframework.web.reactive: DEBUG
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"

# Swagger 설정 (개발환경에서만 활성화)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: true

# AWS S3 설정 (개발환경)
cloud:
  aws:
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${S3_BUCKET:waytoearth-assets}  # 개발용 버킷

# 개발환경 관리자 도구
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      instance: ${INSTANCE_ID:app-1}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
